<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Tax Cup | Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="header-brand.css"><link rel="stylesheet" href="payroll.css"></head>
<body><main class="login-shell"><div class="brand"><img class="brand-logo" src="tax-cup-logo.svg" alt="The Tax Cup logo"><span class="brand-copy"><span class="brand-name">THE <em>TAX</em> CUP</span><small class="brand-tagline">SIMPLIFYING TAX &amp; COMPLIANCE FOR BUSINESSES</small></span></div><section class="login-card"><p class="kicker">Secure access</p><h1>Welcome<br><span>back.</span></h1><p>Sign in to the payroll control room. This browser prototype uses local accounts for demonstration.</p><form id="login-form"><label>Email address<input id="login-email" type="email" value="admin@taxcup.local" required></label><label>Password<input id="login-password" type="password" placeholder="Enter password" required></label><label>Role for this session<select id="login-role"><option>Super Administrator</option><option>HR Manager</option><option>Accountant</option><option>Payroll Officer</option><option>Management</option></select></label><button class="primary-button" type="submit">Sign in ↗</button><p class="login-error" id="login-error"></p></form></section><a class="back-link" href="index.html">← Return to calculator</a></main><script src="login.js"></script></body></html>
